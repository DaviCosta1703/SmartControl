<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro SmartControl</title>
</head>
<body>
     <div><img src="assets/images/logo.jpg" 
              alt="Foto de perfil do Usuário" width="100" height="100"></div>

    <h1>Cadastro Smart Control</h1>
    <form method="get" action="dashboard.html">

        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nome" placeholder="Digite seu nome completo." required >
        
        <label for="email">E-mail:</label>
        <input type="text" name="email" id="email" placeholder="Digite seu e-mail." required >

        <label for="senha">Senha:</label>
        <input type="password" name="senha" id="senha" placeholder="Digite sua senha." required >

        <label for="termosdeuso">Você aceita os termos de uso e política?</label>
        <input type="checkbox" name="termosdeuso" id="termosdeuso" placeholder="" required >

        <a href="" >Esqueceu a sehna?</a>

        <button> <a href="dashboard.html"></a>Login</button>>

        <a href="https://pedrotech.com.br/pedrolandia/" target="_blank">
            Portal Pedro Landia</a>
</body>
</html>
